name: Test camera and installers

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install image libraries
        run: python -m pip install -r requirements.txt
      - name: Build the release downloads
        run: python tools/package_release.py --version 0.1.0 --output dist
      - name: Download and verify the official UE4SS test fixture
        shell: python
        run: |
          import hashlib, os, pathlib, urllib.request
          asset = "https://github.com/UE4SS-RE/RE-UE4SS/releases/download/v4.0.0/UE4SS_v4.0.0.zip"
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "UE4SS_v4.0.0.zip"
          urllib.request.urlretrieve(asset, archive)
          with archive.open("rb") as stream:
              assert hashlib.file_digest(stream, "sha256").hexdigest() == "251ad0d1381a241750e036f5918cbf2b5d7ec58ebc608cb2dd09d459d0c81e45"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              print(f"UE4SS_TEST_ZIP={archive}", file=env)
              windows_zip = pathlib.Path("dist/DenshattackPhotoCamera-0.1.0-windows.zip").resolve()
              print(f"DENSHATTACK_WINDOWS_ARCHIVE={windows_zip}", file=env)
      - name: Test installers, picker settings and photo exporters
        run: python -m unittest discover -s tests -v
      - name: Test camera scripts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          for t in tests/*.lua; do lua5.4 "$t" || exit 1; done
